<body>
  <div class="yvelaferi">
    <div class="block a1"></div>
    <div class="block a2"></div>

    .b1 { grid-column: 4 / span 4; grid-row: 3 / span 2; }

    .c1 { grid-column: 8; grid-row: 2 / span 2; height: 80px; width: 30px;}
    .c2 { grid-column: 9; grid-row: 2; height: 30px; width: 30px;}

</style>
